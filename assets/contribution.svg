<svg width="1200" height="180"
viewBox="0 0 1200 180"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient
id="gradient"
x1="0%"
y1="0%"
x2="100%"
y2="0%">

<stop offset="0%" stop-color="#00ffff"/>
<stop offset="50%" stop-color="#8a2be2"/>
<stop offset="100%" stop-color="#ff00ff"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="5"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

<!-- Background -->

<rect
width="1200"
height="180"
rx="15"
fill="#050505"
stroke="#8a2be2"
stroke-width="2"/>

<!-- Title -->

<text
x="600"
y="45"
text-anchor="middle"
font-family="monospace"
font-size="25"
font-weight="bold"
fill="#ffffff">

KEEP CODING • KEEP BUILDING 🚀

</text>

<!-- Contribution line -->

<path
d="M50 110
C150 70 200 145 300 105
S450 70 550 115
S700 150 800 95
S950 65 1050 110
S1120 125 1150 90"

stroke="url(#gradient)"
stroke-width="5"
fill="none"
filter="url(#glow)"/>

<!-- Dots -->

<g fill="#00ffff">

<circle cx="80" cy="110" r="5"/>
<circle cx="180" cy="95" r="5"/>
<circle cx="280" cy="110" r="5"/>
<circle cx="380" cy="90" r="5"/>
<circle cx="480" cy="105" r="5"/>
<circle cx="580" cy="125" r="5"/>
<circle cx="680" cy="125" r="5"/>
<circle cx="780" cy="100" r="5"/>
<circle cx="880" cy="90" r="5"/>
<circle cx="980" cy="100" r="5"/>
<circle cx="1080" cy="115" r="5"/>

</g>

<!-- Bottom -->

<text
x="600"
y="155"
text-anchor="middle"
font-family="monospace"
font-size="15"
fill="#ff00ff">

CODE • LEARN • BUILD • IMPROVE • REPEAT

</text>

</svg>
