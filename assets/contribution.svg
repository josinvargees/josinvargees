<svg width="500" height="500"
viewBox="0 0 500 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient
id="body"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop offset="0%" stop-color="#00ffff"/>
<stop offset="100%" stop-color="#8a2be2"/>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="5"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

<!-- Background -->

<circle
cx="250"
cy="250"
r="225"
fill="#070707"
stroke="#8a2be2"
stroke-width="7"
filter="url(#glow)"/>

<!-- Decorative circles -->

<circle
cx="250"
cy="250"
r="195"
fill="none"
stroke="#00ffff"
opacity="0.15"
stroke-width="2"/>

<circle
cx="250"
cy="250"
r="175"
fill="none"
stroke="#ff00ff"
opacity="0.15"
stroke-width="2"/>

<!-- Hair -->

<path
d="M180 160
Q180 70 250 65
Q325 70 320 160
Q290 120 250 125
Q210 120 180 160Z"
fill="#151515"
stroke="#00ffff"
stroke-width="3"/>

<!-- Face -->

<circle
cx="250"
cy="165"
r="62"
fill="#d89b72"/>

<!-- Eyes -->

<circle
cx="225"
cy="165"
r="6"
fill="#111"/>

<circle
cx="275"
cy="165"
r="6"
fill="#111"/>

<!-- Smile -->

<path
d="M230 190 Q250 205 270 190"
stroke="#111"
stroke-width="4"
fill="none"/>

<!-- Body -->

<path
d="M150 390
Q160 265 250 255
Q340 265 350 390Z"
fill="url(#body)"
stroke="#00ffff"
stroke-width="3"/>

<!-- Laptop -->

<rect
x="170"
y="300"
width="160"
height="90"
rx="10"
fill="#0d0d0d"
stroke="#00ffff"
stroke-width="4"/>

<!-- Laptop Screen -->

<rect
x="185"
y="315"
width="130"
height="60"
fill="#050505"/>

<!-- Code -->

<text
x="205"
y="345"
font-family="monospace"
font-size="18"
fill="#00ffff">

&lt;/&gt;

</text>

<text
x="205"
y="365"
font-family="monospace"
font-size="12"
fill="#ff00ff">

JAVA

</text>

<!-- Laptop Base -->

<path
d="M155 390 H345 L330 405 H170Z"
fill="#8a2be2"/>

<!-- Developer text -->

<text
x="250"
y="450"
text-anchor="middle"
font-family="monospace"
font-size="15"
font-weight="bold"
fill="#00ffff">

JAVA DEVELOPER

</text>

</svg>
