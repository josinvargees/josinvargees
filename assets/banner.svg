<svg width="1200" height="350" viewBox="0 0 1200 350"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Main background -->
    <linearGradient id="background"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">

        <stop offset="0%" stop-color="#020617"/>
        <stop offset="45%" stop-color="#07111f"/>
        <stop offset="100%" stop-color="#020617"/>

    </linearGradient>

    <!-- Cyber gradient -->
    <linearGradient id="cyber"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

        <stop offset="0%" stop-color="#00e5ff"/>
        <stop offset="50%" stop-color="#0077ff"/>
        <stop offset="100%" stop-color="#00e5ff"/>

    </linearGradient>

    <!-- Purple cyber gradient -->
    <linearGradient id="purple"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

        <stop offset="0%" stop-color="#7c3aed"/>
        <stop offset="50%" stop-color="#c026d3"/>
        <stop offset="100%" stop-color="#7c3aed"/>

    </linearGradient>

    <!-- Glow -->
    <filter id="glow">

        <feGaussianBlur
            stdDeviation="5"
            result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow">

        <feGaussianBlur
            stdDeviation="12"
            result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

    <!-- Grid -->
    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">

        <path
            d="M45 0H0V45"
            fill="none"
            stroke="#00e5ff"
            stroke-width="0.6"
            opacity="0.12"/>

    </pattern>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
    width="1200"
    height="350"
    fill="url(#background)"
/>


<!-- ================================================= -->
<!-- GRID -->
<!-- ================================================= -->

<rect
    width="1200"
    height="350"
    fill="url(#grid)"
/>


<!-- ================================================= -->
<!-- BACKGROUND GLOW -->
<!-- ================================================= -->

<ellipse
    cx="600"
    cy="175"
    rx="330"
    ry="150"
    fill="#0077ff"
    opacity="0.05"
    filter="url(#strongGlow)"
/>


<!-- ================================================= -->
<!-- LEFT TERMINAL -->
<!-- ================================================= -->

<g transform="translate(65 70)">

    <rect
        width="280"
        height="180"
        rx="12"
        fill="#02050b"
        stroke="#00e5ff"
        stroke-width="1.5"
        opacity="0.95"
    />

    <!-- Terminal header -->

    <rect
        width="280"
        height="32"
        rx="12"
        fill="#07111f"
    />

    <circle
        cx="20"
        cy="16"
        r="5"
        fill="#ff5f56"
    />

    <circle
        cx="38"
        cy="16"
        r="5"
        fill="#ffbd2e"
    />

    <circle
        cx="56"
        cy="16"
        r="5"
        fill="#27c93f"
    />

    <text
        x="78"
        y="21"
        font-family="monospace"
        font-size="11"
        fill="#64748b">

        terminal

    </text>


    <!-- Terminal commands -->

    <text
        x="20"
        y="62"
        font-family="monospace"
        font-size="13"
        fill="#00e5ff">

        $ whoami

    </text>

    <text
        x="20"
        y="84"
        font-family="monospace"
        font-size="13"
        fill="#ffffff">

        josinvargees

    </text>


    <text
        x="20"
        y="112"
        font-family="monospace"
        font-size="13"
        fill="#00e5ff">

        $ java --version

    </text>

    <text
        x="20"
        y="134"
        font-family="monospace"
        font-size="12"
        fill="#94a3b8">

        Java 25

    </text>


    <text
        x="20"
        y="160"
        font-family="monospace"
        font-size="13"
        fill="#00e5ff">

        $ status

    </text>

    <text
        x="92"
        y="160"
        font-family="monospace"
        font-size="13"
        fill="#27c93f">

        ONLINE

    </text>

</g>


<!-- ================================================= -->
<!-- RIGHT CODE -->
<!-- ================================================= -->

<g
    font-family="monospace"
    font-size="12"
    fill="#00e5ff"
    opacity="0.22">

    <text x="900" y="70">
        public class Developer {
    </text>

    <text x="925" y="90">
        String name = "Josin";
    </text>

    <text x="925" y="110">
        String role = "Developer";
    </text>

    <text x="925" y="130">
        build();
    </text>

    <text x="900" y="150">
        }
    </text>


    <text x="900" y="195">
        &lt;security&gt;
    </text>

    <text x="925" y="215">
        protected = true;
    </text>

    <text x="925" y="235">
        encrypted = true;
    </text>

    <text x="900" y="255">
        &lt;/security&gt;
    </text>

</g>


<!-- ================================================= -->
<!-- CENTRAL SHIELD -->
<!-- ================================================= -->

<g transform="translate(600 95)">

    <!-- Outer circles -->

    <circle
        cx="0"
        cy="0"
        r="78"
        fill="none"
        stroke="#0077ff"
        stroke-width="1"
        opacity="0.25"
    />

    <circle
        cx="0"
        cy="0"
        r="68"
        fill="none"
        stroke="#00e5ff"
        stroke-width="2"
        stroke-dasharray="5 8"
        filter="url(#glow)"
    />

    <!-- Shield -->

    <path
        d="
        M 0 -52
        L 42 -34
        L 37 18
        Q 25 47 0 61
        Q -25 47 -37 18
        L -42 -34
        Z"
        fill="#031827"
        stroke="url(#cyber)"
        stroke-width="4"
        filter="url(#glow)"
    />

    <!-- Shield inner -->

    <path
        d="
        M 0 -38
        L 28 -26
        L 25 13
        Q 15 34 0 43
        Q -15 34 -25 13
        L -28 -26
        Z"
        fill="none"
        stroke="#7c3aed"
        stroke-width="2"
    />

    <!-- Code symbol -->

    <path
        d="M-20 0 L-8 10 L-20 20"
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <path
        d="M20 0 L8 10 L20 20"
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <line
        x1="5"
        y1="-5"
        x2="-5"
        y2="25"
        stroke="#00e5ff"
        stroke-width="3"
    />

</g>


<!-- ================================================= -->
<!-- NAME -->
<!-- ================================================= -->

<text
    x="600"
    y="205"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="47"
    font-weight="700"
    letter-spacing="4"
    fill="#ffffff">

    JOSIN VARGEEZ

</text>


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<text
    x="600"
    y="235"
    text-anchor="middle"
    font-family="monospace"
    font-size="17"
    font-weight="600"
    letter-spacing="3"
    fill="#00e5ff">

    JAVA FULL STACK DEVELOPER

</text>


<!-- ================================================= -->
<!-- TECHNOLOGY -->
<!-- ================================================= -->

<text
    x="600"
    y="260"
    text-anchor="middle"
    font-family="monospace"
    font-size="12"
    letter-spacing="2"
    fill="#94a3b8">

    JAVA  •  SPRING BOOT  •  REACT  •  MYSQL  •  SECURITY

</text>


<!-- ================================================= -->
<!-- STATUS BAR -->
<!-- ================================================= -->

<g transform="translate(425 285)">

    <rect
        width="350"
        height="32"
        rx="16"
        fill="#020617"
        stroke="#0077ff"
        stroke-width="1"
    />

    <circle
        cx="25"
        cy="16"
        r="5"
        fill="#27c93f"
        filter="url(#glow)"
    />

    <text
        x="40"
        y="21"
        font-family="monospace"
        font-size="11"
        fill="#27c93f">

        SYSTEM ONLINE

    </text>

    <line
        x1="150"
        y1="8"
        x2="150"
        y2="24"
        stroke="#334155"
    />

    <text
        x="170"
        y="21"
        font-family="monospace"
        font-size="11"
        fill="#00e5ff">

        BUILDING THE FUTURE

    </text>

</g>


<!-- ================================================= -->
<!-- BOTTOM CIRCUIT -->
<!-- ================================================= -->

<g
    stroke="url(#cyber)"
    stroke-width="2"
    fill="none"
    opacity="0.7">

    <path d="M60 325 H230 L250 305 H350"/>

    <path d="M850 305 H950 L970 325 H1140"/>

</g>


<!-- Circuit nodes -->

<g fill="#00e5ff" filter="url(#glow)">

    <circle cx="60" cy="325" r="3"/>
    <circle cx="350" cy="305" r="3"/>
    <circle cx="850" cy="305" r="3"/>
    <circle cx="1140" cy="325" r="3"/>

</g>


<!-- ================================================= -->
<!-- CORNER MARKS -->
<!-- ================================================= -->

<g
    stroke="#00e5ff"
    stroke-width="2"
    fill="none"
    opacity="0.7">

    <path d="M25 55 V25 H55"/>
    <path d="M1175 55 V25 H1145"/>

    <path d="M25 295 V325 H55"/>
    <path d="M1175 295 V325 H1145"/>

</g>


<!-- ================================================= -->
<!-- SCAN LINE -->
<!-- ================================================= -->

<line
    x1="0"
    y1="340"
    x2="1200"
