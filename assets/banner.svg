<svg width="1200" height="350" viewBox="0 0 1200 350"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Dark Background -->

<linearGradient id="bg"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#000000"/>
<stop offset="50%" stop-color="#001a0b"/>
<stop offset="100%" stop-color="#000000"/>

</linearGradient>

<!-- Hacker Green -->

<linearGradient id="green"
x1="0%" y1="0%"
x2="100%" y2="0%">

<stop offset="0%" stop-color="#00ff41"/>
<stop offset="50%" stop-color="#39ff14"/>
<stop offset="100%" stop-color="#00ff9d"/>

</linearGradient>

<!-- Glow -->

<filter id="glow">

<feGaussianBlur
stdDeviation="5"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

<!-- Strong Glow -->

<filter id="strongGlow">

<feGaussianBlur
stdDeviation="10"
result="blur"/>

<feMerge>

<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect
width="1200"
height="350"
fill="url(#bg)"/>


<!-- ===================================================== -->
<!-- MATRIX BACKGROUND -->
<!-- ===================================================== -->

<g
font-family="monospace"
font-size="14"
fill="#00ff41"
opacity="0.12">

<text x="20" y="30">01001010</text>
<text x="20" y="55">11010101</text>
<text x="20" y="80">00110110</text>
<text x="20" y="105">10101001</text>
<text x="20" y="130">01100101</text>
<text x="20" y="155">11001100</text>
<text x="20" y="180">01010101</text>
<text x="20" y="205">10011001</text>
<text x="20" y="230">01101110</text>
<text x="20" y="255">11001010</text>
<text x="20" y="280">00101101</text>
<text x="20" y="305">10110110</text>

<text x="1050" y="30">10101010</text>
<text x="1050" y="55">01100110</text>
<text x="1050" y="80">11001101</text>
<text x="1050" y="105">00110101</text>
