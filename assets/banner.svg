<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#001A00"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Terminal Header -->
  <circle cx="30" cy="30" r="6" fill="#FF5F56"/>
  <circle cx="55" cy="30" r="6" fill="#FFBD2E"/>
  <circle cx="80" cy="30" r="6" fill="#27C93F"/>

  <text x="105" y="35"
        fill="#39FF14"
        font-family="monospace"
        font-size="16">
        root@josin:~$
  </text>

  <!-- Left Terminal -->
  <text x="60" y="90"
        fill="#39FF14"
        font-family="monospace"
        font-size="18">
&gt; initializing_secure_environment...
  </text>

  <text x="60" y="125"
        fill="#90EE90"
        font-family="monospace"
        font-size="15">
[OK] java_backend ........ ACTIVE
  </text>

  <text x="60" y="150"
        fill="#90EE90"
        font-family="monospace"
        font-size="15">
[OK] spring_boot ......... ACTIVE
  </text>

  <text x="60" y="175"
        fill="#90EE90"
        font-family="monospace"
        font-size="15">
[OK] react_frontend ...... ACTIVE
  </text>

  <text x="60" y="200"
        fill="#90EE90"
        font-family="monospace"
        font-size="15">
[OK] mysql_database ...... ACTIVE
  </text>

  <text x="60" y="235"
        fill="#39FF14"
        font-family="monospace"
