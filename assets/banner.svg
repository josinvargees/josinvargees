<svg width="1200" height="350" viewBox="0 0 1200 350"
xmlns="http://www.w3.org/2000/svg">

<defs>

    <!-- Background -->
    <linearGradient id="bg"
        x1="0%" y1="0%"
        x2="100%" y2="100%">
        <stop offset="0%" stop-color="#020303"/>
        <stop offset="50%" stop-color="#07120c"/>
        <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Green Neon -->
    <linearGradient id="neon"
        x1="0%" y1="0%"
        x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00ff41"/>
        <stop offset="50%" stop-color="#00ff9c"/>
        <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>

    <!-- Cyan -->
    <linearGradient id="cyan"
        x1="0%" y1="0%"
        x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00ffff"/>
        <stop offset="100%" stop-color="#00ff9c"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <filter id="softGlow">
        <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid"
        width="40"
        height="40"
        patternUnits="userSpaceOnUse">

        <path
            d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#00ff41"
            stroke-width="0.5"
            opacity="0.12"/>

    </pattern>

</defs>


<!-- ====================================================== -->
<!-- BACKGROUND -->
<!-- ====================================================== -->

<rect
    width="1200"
    height="350"
    fill="url(#bg)"
/>


<!-- ====================================================== -->
<!-- GRID -->
<!-- ====================================================== -->

<rect
    width="1200"
    height="350"
    fill="url(#grid)"
/>


<!-- ====================================================== -->
<!-- AMBIENT GREEN GLOW -->
<!-- ====================================================== -->

<ellipse
    cx="600"
    cy="160"
    rx="360"
    ry="130"
    fill="#00ff41"
    opacity="0.035"
    filter="url(#softGlow)"
/>


<!-- ====================================================== -->
<!-- DECORATIVE CODE -->
<!-- ====================================================== -->

<g
    font-family="monospace"
    font-size="13"
    fill="#00ff41"
    opacity="0.18">

    <text x="45" y="55">
        01001101 10101001
    </text>

    <text x="45" y="78">
        11001010 00110101
    </text>

    <text x="45" y="101">
        01101001 11010110
    </text>

    <text x="45" y="124">
        10010110 01001010
    </text>

    <text x="970" y="55">
        11001001 01010110
    </text>

    <text x="970" y="78">
        00110101 10101010
    </text>

    <text x="970" y="101">
        11100100 01010101
    </text>

    <text x="970" y="124">
        01011010 10100101
    </text>

</g>


<!-- ====================================================== -->
<!-- TOP SECURITY LINE -->
<!-- ====================================================== -->

<line
    x1="80"
    y1="35"
    x2="1120"
    y2="35"
    stroke="#00ff41"
    stroke-width="1"
    opacity="0.35"
/>


<!-- ====================================================== -->
<!-- LEFT CYBER SYMBOL -->
<!-- ====================================================== -->

<g transform="translate(120 135)">

    <!-- Outer circle -->

    <circle
        cx="0"
        cy="0"
        r="62"
        fill="none"
        stroke="#00ff41"
        stroke-width="2"
        opacity="0.6"
    />

    <circle
        cx="0"
        cy="0"
        r="48"
        fill="#001a0b"
        stroke="#00ff41"
        stroke-width="2"
        opacity="0.8"
    />

    <!-- Shield -->

    <path
        d="
        M 0 -34
        L 27 -22
        L 23 12
        Q 0 37 -23 12
        L -27 -22
        Z"
        fill="none"
        stroke="url(#neon)"
        stroke-width="4"
        filter="url(#glow)"
    />

    <!-- Lock -->

    <rect
        x="-12"
        y="-2"
        width="24"
        height="21"
        rx="3"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
    />

    <path
        d="M -7 -2 V -10
        Q -7 -20 0 -20
        Q 7 -20 7 -10
        V -2"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
    />

    <circle
        cx="0"
        cy="8"
        r="2.5"
        fill="#00ff41"
    />

</g>


<!-- ====================================================== -->
<!-- MAIN NAME -->
<!-- ====================================================== -->

<text
    x="600"
    y="130"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="bold"
    letter-spacing="5"
    fill="#ffffff">

    JOSIN VARGEEZ

</text>


<!-- ====================================================== -->
<!-- GREEN UNDERLINE -->
<!-- ====================================================== -->

<rect
    x="365"
    y="148"
    width="470"
    height="2"
    fill="url(#neon)"
    filter="url(#glow)"
/>


<!-- ====================================================== -->
<!-- TITLE -->
<!-- ====================================================== -->

<text
    x="600"
    y="185"
    text-anchor="middle"
    font-family="monospace"
    font-size="21"
    font-weight="bold"
    letter-spacing="3"
    fill="#00ff41">

    JAVA FULL STACK DEVELOPER

</text>


<!-- ====================================================== -->
<!-- SPECIALIZATION -->
<!-- ====================================================== -->

<text
    x="600"
    y="215"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    letter-spacing="2"
    fill="#a5ffbd">

    JAVA  •  SPRING BOOT  •  REACT  •  MYSQL

</text>


<!-- ====================================================== -->
<!-- CYBER STATUS -->
<!-- ====================================================== -->

<g transform="translate(600 252)">

    <circle
        cx="-140"
        cy="-4"
        r="5"
        fill="#00ff41"
        filter="url(#glow)"
    />

    <text
        x="-125"
        y="1"
        font-family="monospace"
        font-size="13"
        fill="#00ff41">

        SYSTEM ONLINE

    </text>


    <circle
        cx="20"
        cy="-4"
        r="5"
        fill="#00ffff"
        filter="url(#glow)"
    />

    <text
        x="35"
        y="1"
        font-family="monospace"
        font-size="13"
        fill="#00ffff">

        SECURITY ACTIVE

    </text>

</g>


<!-- ====================================================== -->
<!-- BOTTOM CYBER LINE -->
<!-- ====================================================== -->

<path
    d="M 80 295
       L 300 295
       L 325 280
       L 350 295
       L 850 295
       L 875 280
       L 900 295
       L 1120 295"
    fill="none"
    stroke="url(#neon)"
    stroke-width="2"
    filter="url(#glow)"
/>


<!-- ====================================================== -->
<!-- BOTTOM TEXT -->
<!-- ====================================================== -->

<text
    x="600"
    y="325"
    text-anchor="middle"
    font-family="monospace"
    font-size="13"
    letter-spacing="4"
    fill="#00ff41">

    CODE  //  SECURE  //  BUILD  //  INNOVATE

</text>


<!-- ====================================================== -->
<!-- CORNER DECORATIONS -->
<!-- ====================================================== -->

<g
    stroke="#00ff41"
    stroke-width="2"
    fill="none"
    opacity="0.7">

    <!-- Top Left -->
    <path d="M35 70 V45 H60"/>
    <path d="M35 85 V105 H60"/>

    <!-- Top Right -->
    <path d="M1165 70 V45 H1140"/>
    <path d="M1165 85 V105 H1140"/>

    <!-- Bottom Left -->
    <path d="M35 280 V305 H60"/>

    <!-- Bottom Right -->
    <path d="M1165 280 V305 H1140"/>

</g>


<!-- ====================================================== -->
<!-- SCAN LINE -->
<!-- ====================================================== -->

<rect
    x="80"
    y="275"
    width="1040"
    height="1"
    fill="#00ff41"
    opacity="0.25"
/>

</svg>
