<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350">

<rect width="1200" height="350" fill="#050505"/>

<rect x="20" y="20" width="1160" height="310" rx="15"
      fill="#07110b" stroke="#00ff66" stroke-width="2"/>

<!-- Grid -->

<g stroke="#00ff66" stroke-width="1" opacity="0.08">
<line x1="20" y1="60" x2="1180" y2="60"/>
<line x1="20" y1="100" x2="1180" y2="100"/>
<line x1="20" y1="140" x2="1180" y2="140"/>
<line x1="20" y1="180" x2="1180" y2="180"/>
<line x1="20" y1="220" x2="1180" y2="220"/>
<line x1="20" y1="260" x2="1180" y2="260"/>
<line x1="20" y1="300" x2="1180" y2="300"/>

<line x1="60" y1="20" x2="60" y2="330"/>
<line x1="120" y1="20" x2="120" y2="330"/>
<line x1="180" y1="20" x2="180" y2="330"/>
<line x1="240" y1="20" x2="240" y2="330"/>
<line x1="960" y1="20" x2="960" y2="330"/>
<line x1="1020" y1="20" x2="1020" y2="330"/>
<line x1="1080" y1="20" x2="1080" y2="330"/>
<line x1="1140" y1="20" x2="1140" y2="330"/>
</g>

<!-- Left terminal -->

<rect x="55" y="75" width="260" height="175" rx="8"
      fill="#020604" stroke="#00ff66" stroke-width="2"/>

<rect x="55" y="75" width="260" height="30"
      rx="8" fill="#0b1a11"/>

<circle cx="75" cy="90" r="5" fill="#ff5555"/>
<circle cx="92" cy="90" r="5" fill="#ffaa00"/>
<circle cx="109" cy="90" r="5" fill="#00ff66"/>

<text x="130" y="95"
      font-family="monospace"
      font-size="11"
      fill="#00ff66">
terminal
</text>

<text x="75" y="130"
      font-family="monospace"
      font-size="13"
      fill="#00ff66">
$ whoami
</text>

<text x="75" y="153"
      font-family="monospace"
      font-size="13"
      fill="#ffffff">
josinvargees
</text>

<text x="75" y="180"
      font-family="monospace"
      font-size="13"
      fill="#00ff66">
$ java --version
</text>

<text x="75" y="202"
      font-family="monospace"
      font-size="12"
      fill="#aaaaaa">
Java 25
</text>

<text x="75" y="228"
      font-family="monospace"
      font-size="13"
      fill="#00ff66">
$ status
</text>

<text x="145" y="228"
      font-family="monospace"
      font-size="13"
      fill="#00ff66">
ONLINE
</text>


<!-- Main name -->

<text x="650" y="125"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="52"
      font-weight="bold"
      letter-spacing="4"
      fill="#ffffff">
JOSIN VARGEEZ
</text>

<!-- Green line -->

<line x1="430" y1="145" x2="870" y2="145"
      stroke="#00ff66"
      stroke-width="2"/>

<!-- Developer title -->

<text x="650" y="180"
      text-anchor="middle"
      font-family="monospace"
      font-size="21"
      font-weight="bold"
      letter-spacing="2"
      fill="#00ff66">
JAVA FULL STACK DEVELOPER
</text>

<!-- Technologies -->

<text x="650" y="210"
      text-anchor="middle"
      font-family="monospace"
      font-size="13"
      fill="#cccccc">
JAVA  |  SPRING BOOT  |  REACT  |  MYSQL
</text>

<!-- Cyber security -->

<rect x="485" y="235" width="330" height="38"
      rx="19"
      fill="#020604"
      stroke="#00ff66"
      stroke-width="1"/>

<circle cx="510" cy="254" r="5"
        fill="#00ff66"/>

<text x="525" y="259"
      font-family="monospace"
      font-size="12"
      fill="#00ff66">
CYBER SECURITY MODE: ACTIVE
</text>


<!-- Shield -->

<path d="M1030 75 L1080 98 L1072 160
         C1065 185 1048 202 1030 210
         C1012 202 995 185 988 160
         L980 98 Z"
      fill="#06130b"
      stroke="#00ff66"
      stroke-width="3"/>

<path d="M1030 100 L1055 112 L1050 153
         C1045 168 1037 178 1030 182
         C1023 178 1015 168 1010 153
         L1005 112 Z"
      fill="none"
      stroke="#00aa55"
      stroke-width="2"/>

<!-- Code symbol inside shield -->

<path d="M1018 138 L1005 148 L1018 158"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"/>

<path d="M1042 138 L1055 148 L1042 158"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"/>

<line x1="1035" y1="133"
      x2="1025" y2="163"
      stroke="#00ff66"
      stroke-width="3"/>


<!-- Bottom status -->

<text x="600" y="305"
      text-anchor="middle"
      font-family="monospace"
      font-size="13"
      letter-spacing="3"
      fill="#00ff66">
CODE  //  BUILD  //  SECURE  //  INNOVATE
</text>

<!-- Corner decorations -->

<path d="M35 55 L35 35 L55 35"
      fill="none"
      stroke="#00ff66"
      stroke-width="2"/>

<path d="M1165 55 L1165 35 L1145 35"
      fill="none"
      stroke="#00ff66"
      stroke-width="2"/>

<path d="M35 295 L35 315 L55 315"
      fill="none"
      stroke="#00ff66"
      stroke-width="2"/>

<path d="M1165 295 L1165 315 L1145 315"
      fill="none"
      stroke="#00ff66"
      stroke-width="2"/>

</svg>
