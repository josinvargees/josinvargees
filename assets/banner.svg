  <text x="1000" y="130"
        fill="#90EE90"
        font-family="monospace"
        font-size="13">
☕ Java
  </text>

  <text x="1000" y="155"
        fill="#90EE90"
        font-family="monospace"
        font-size="13">
🍃 Spring Boot
  </text>

  <text x="1000" y="180"
        fill="#90EE90"
        font-family="monospace"
