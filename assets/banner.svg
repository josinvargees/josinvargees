<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1280" y2="320">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bgGradient)"/>

  <!-- Decorative Circles -->
  <circle cx="1120" cy="80" r="140"
          stroke="rgba(255,255,255,0.06)"
          stroke-width="1"
          fill="none"/>

  <circle cx="1120" cy="80" r="100"
          stroke="rgba(255,255,255,0.04)"
          stroke-width="1"
          fill="none"/>

  <circle cx="180" cy="260" r="90"
          stroke="rgba(255,255,255,0.05)"
          stroke-width="1"
          fill="none"/>

  <!-- Top Border -->
  <line x1="50" y1="45" x2="1230" y2="45"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="1"/>

  <!-- Small Label -->
  <text x="60"
        y="32"
        fill="#999999"
        font-size="13"
        font-family="Segoe UI, Arial, sans-serif"
        letter-spacing="4">
        JAVA FULL STACK DEVELOPER
  </text>

  <!-- Main Name -->
  <text x="640"
        y="145"
        text-anchor="middle"
        fill="#FFFFFF"
        font-size="72"
        font-weight="700"
        font-family="Georgia, serif">
        JOSIN VARGHESE
  </text>

  <!-- Subtitle -->
  <text x="640"
        y="190"
        text-anchor="middle"
        fill="#999999"
        font-size="20"
        letter-spacing="6"
        font-family="Segoe UI, Arial, sans-serif">
        SPRING BOOT • REACT • MYSQL
  </text>

  <!-- Tagline -->
  <text x="640"
        y="225"
        text-anchor="middle"
        fill="#BDBDBD"
        font-size="16"
        font-family="Segoe UI, Arial, sans-serif">
        Building scalable backend systems and modern web experiences
  </text>

  <!-- Left Card -->
  <rect x="60"
        y="90"
        width="250"
        height="130"
        rx="18"
        fill="#0D0D0D"
        stroke="rgba(255,255,255,0.12)"
        filter="url(#shadow)"/>

  <text x="85"
        y="125"
        fill="#FFFFFF"
        font-size="18"
        font-family="Segoe UI">
        Tech Stack
  </text>

  <text x="85"
        y="155"
        fill="#999999"
        font-size="14"
        font-family="Segoe UI">
        JAVA
  </text>

  <text x="85"
        y="178"
        fill="#999999"
        font-size="14"
        font-family="Segoe UI">
        SPRING BOOT
  </text>

  <text x="85"
        y="201"
        fill="#999999"
        font-size="14"
        font-family="Segoe UI">
        REACT • MYSQL
  </text>

  <!-- Right Card -->
  <rect x="970"
        y="90"
        width="250"
        height="130"
        rx="18"
        fill="#0D0D0D"
        stroke="rgba(255,255,255,0.12)"
        filter="url(#shadow)"/>

  <text x="995"
        y="125"
        fill="#FFFFFF"
        font-size="18"
        font-family="Segoe UI">
        Focus Areas
  </text>

  <text x="995"
        y="155"
        fill="#999999"
        font-size="14"
        font-family="Segoe UI">
        REST APIs
  </text>

  <text x="995"
        y="178"
        fill="#999999"
        font-size="14"
        font-family="Segoe UI">
        Backend Architecture
  </text>

  <text x="995"
        y="201"
        fill="#999999"
        font-size="14"
        font-family="Segoe UI">
        Full Stack Development
  </text>

  <!-- Bottom Border -->
  <line x1="50"
        y1="285"
        x2="1230"
        y2="285"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="1"/>

  <!-- Footer -->
  <text x="60"
        y="305"
        fill="#777777"
        font-size="12"
        font-family="Segoe UI">
        PORTFOLIO • OPEN SOURCE • SOFTWARE ENGINEERING
  </text>

  <text x="1120"
        y="305"
        fill="#777777"
        font-size="12"
        font-family="Segoe UI">
        2026
  </text>

</svg>
